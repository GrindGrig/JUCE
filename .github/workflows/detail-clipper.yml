# Builds the Detail Clipper plug-in (projects/DetailClipper).
#
# - Every push that touches the plug-in builds the Windows x64 package
#   (VST3 + standalone app + Install.txt) and attaches it to the run.
# - Pushing a tag named detail-clipper-v<version>, or starting the workflow by
#   hand with "release" ticked, also publishes that package as the GitHub
#   Release detail-clipper-v<version> (the version comes from CMakeLists.txt).
#   The web demo's download button links to it.
# - The macOS build (VST3, AU, Standalone; universal) runs for release tags, or
#   when started by hand with "macos" ticked. When it runs, the release gets
#   the macOS zip as well.

name: Detail Clipper

on:
  push:
    branches: ["**"]
    paths:
      - "projects/DetailClipper/**"
      - "projects/shared/cicada_ui/**"
      - ".github/workflows/detail-clipper.yml"
    tags: ["detail-clipper-v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the Windows package as a GitHub Release"
        type: boolean
        default: false
      macos:
        description: "Also build for macOS (and add it to the release)"
        type: boolean
        default: false

jobs:
  windows:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S projects/DetailClipper -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 and Standalone
        run: cmake --build build --config Release --target DetailClipper_VST3 DetailClipper_Standalone --parallel

      - name: Package
        id: package
        shell: pwsh
        run: |
          $v = (Select-String -Path projects/DetailClipper/CMakeLists.txt -Pattern 'project\(DETAIL_CLIPPER VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          $out = "Detail Clipper $v (Windows x64)"
          $rel = "build/DetailClipper_artefacts/Release"
          New-Item -ItemType Directory -Path "dist/$out" | Out-Null
          Copy-Item -Recurse "$rel/VST3/Detail Clipper.vst3" "dist/$out/"
          Copy-Item "$rel/Standalone/Detail Clipper.exe" "dist/$out/"
          @(
            "Detail Clipper $v - Windows x64",
            "",
            "INSTALL THE PLUG-IN",
            "1. Copy the whole 'Detail Clipper.vst3' folder into:",
            "   C:\Program Files\Common Files\VST3",
            "2. Rescan plug-ins in your DAW. It is listed under the maker 'Cicada', in Fx / Distortion.",
            "",
            "TRY IT WITHOUT A DAW",
            "Run 'Detail Clipper.exe'. Pick your audio device in Options > Audio/MIDI Settings.",
            "Windows may warn because the app is unsigned: choose More info > Run anyway.",
            "",
            "Detail Clipper is built with JUCE (AGPLv3 / commercial licence).",
            "Source: https://github.com/${{ github.repository }}/tree/${{ github.sha }}/projects/DetailClipper"
          ) | Set-Content -Encoding utf8 "dist/$out/Install.txt"
          Compress-Archive -Path "dist/$out" -DestinationPath "dist/DetailClipper-$v-Windows-x64.zip"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: DetailClipper-Windows-x64
          path: dist/*.zip
          if-no-files-found: error

  release:
    # runs after both builds; the macOS one may be skipped (then the release is Windows only)
    if: >-
      always() && needs.windows.result == 'success' && needs.macos.result != 'failure' && needs.macos.result != 'cancelled' &&
      (startsWith(github.ref, 'refs/tags/detail-clipper-v') || (github.event_name == 'workflow_dispatch' && inputs.release))
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: DetailClipper-*
          merge-multiple: true
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: detail-clipper-v${{ needs.windows.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Detail Clipper ${{ needs.windows.outputs.version }}
          make_latest: true
          files: dist/*.zip
          body: |
            Detail Clipper, a hard clipper that keeps the detail, in the Cicada look.

            **Windows x64:** download the zip below, unzip it and copy `Detail Clipper.vst3` into `C:\Program Files\Common Files\VST3`, then rescan plug-ins in your DAW. `Detail Clipper.exe` runs it without a DAW.

            **macOS (Apple silicon and Intel), when attached:** unzip the macOS zip and follow its Install.txt. The build is not notarized, so macOS needs one Terminal command to allow it.

            Source: [`projects/DetailClipper`](https://github.com/${{ github.repository }}/tree/${{ github.sha }}/projects/DetailClipper). Built with JUCE (AGPLv3 / commercial licence).

  macos:
    if: >-
      startsWith(github.ref, 'refs/tags/detail-clipper-v') || (github.event_name == 'workflow_dispatch' && inputs.macos)
    # Intel image: the Apple silicon pool is often out of capacity. Xcode still
    # builds the universal (arm64 + x86_64) binaries here.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S projects/DetailClipper -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build VST3, AU and Standalone
        run: cmake --build build --config Release --target DetailClipper_VST3 DetailClipper_AU DetailClipper_Standalone -- -quiet

      - name: Sign (ad hoc), check and package
        run: |
          v=$(sed -nE 's/^project\(DETAIL_CLIPPER VERSION ([0-9.]+)\).*/\1/p' projects/DetailClipper/CMakeLists.txt)
          rel="build/DetailClipper_artefacts/Release"
          out="dist/Detail Clipper $v (macOS)"
          mkdir -p "$out"
          cp -R "$rel/VST3/Detail Clipper.vst3" "$rel/AU/Detail Clipper.component" "$rel/Standalone/Detail Clipper.app" "$out/"
          for b in "$out/Detail Clipper.vst3" "$out/Detail Clipper.component" "$out/Detail Clipper.app"; do
            codesign --force --deep --sign - "$b"
            codesign --verify --deep --strict "$b"
            lipo -archs "$b/Contents/MacOS/Detail Clipper"
          done
          {
            echo "Detail Clipper $v - macOS (Apple silicon and Intel)"
            echo ""
            echo "INSTALL THE PLUG-IN"
            echo "1. Copy 'Detail Clipper.vst3' into ~/Library/Audio/Plug-Ins/VST3"
            echo "   and, for Logic or GarageBand, 'Detail Clipper.component' into ~/Library/Audio/Plug-Ins/Components"
            echo "   (in Finder: Go > Go to Folder..., then paste the path)."
            echo "2. This build is not notarized by Apple, so macOS blocks it until you allow it."
            echo "   Open Terminal and run:"
            echo "     xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/\"Detail Clipper.vst3\" ~/Library/Audio/Plug-Ins/Components/\"Detail Clipper.component\""
            echo "3. Rescan plug-ins in your DAW (Logic: restart it). It is listed under the maker 'Cicada'."
            echo ""
            echo "TRY IT WITHOUT A DAW"
            echo "Move 'Detail Clipper.app' to Applications, then in Terminal run"
            echo "  xattr -dr com.apple.quarantine /Applications/\"Detail Clipper.app\""
            echo "and open it. Pick your audio device in Options > Audio/MIDI Settings."
            echo ""
            echo "Detail Clipper is built with JUCE (AGPLv3 / commercial licence)."
            echo "Source: https://github.com/${{ github.repository }}/tree/${{ github.sha }}/projects/DetailClipper"
          } > "$out/Install.txt"
          (cd dist && ditto -c -k --sequesterRsrc --keepParent "Detail Clipper $v (macOS)" "DetailClipper-$v-macOS.zip")
          ls -la dist

      - name: Validate the AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/DetailClipper_artefacts/Release/AU/Detail Clipper.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aufx Dclp Ccda

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: DetailClipper-macOS
          path: dist/*.zip
          if-no-files-found: error
